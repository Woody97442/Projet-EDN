services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - cyber_secu_edn_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed && node src/index.js"]

volumes:
  cyber_secu_edn_postgres_data:
